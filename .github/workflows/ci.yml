name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Run every version to the end, so one failure doesn't hide others.
      fail-fast: false
      matrix:
        # The oldest supported version (see requires-python) and the newest.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      # The default run excludes the live Wikipedia test (see pyproject.toml), so
      # CI stays fast and never fails because of a network problem.
      - name: Test
        run: pytest --cov=animal_adjectives --cov-report=term-missing
