[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-adjectives"
version = "1.0.0"
description = "Lists Wikipedia's collateral adjectives with their animals, as a local HTML report with downloaded pictures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 4.13 is the first release that ships its own type hints, which mypy needs.
    "beautifulsoup4>=4.13",
    "lxml>=5.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # requests ships no type hints of its own; the stubs live in a separate package.
    "types-requests>=2.31",
]

[project.scripts]
animal-adjectives = "animal_adjectives.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the tests run from a fresh checkout, even before `pip install -e .`.
pythonpath = ["src"]
markers = ["network: talks to the live Wikipedia site (deselected by default)"]
# The default run must be fast and deterministic, so it never touches the network.
# Run the live check explicitly with:  pytest -m network
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern syntax for 3.10+, likely bugs, simplifications.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
# The report's inline CSS has long lines that would only get harder to read if wrapped.
ignore = ["E501"]

[tool.ruff.lint.isort]
# The tests import helpers from conftest, which should be grouped with our own code.
known-first-party = ["animal_adjectives", "conftest"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
